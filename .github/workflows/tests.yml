name: Tests

# openHAB Omarchy plugin — validation via the bundled Quickshell utilities.
#
# The plugin itself can't be linted here the way CI wants (qmllint can't
# resolve the qs.* runtime modules outside a quickshell session), so this
# workflow exercises everything that is machine-checkable: the JS model layer
# and the Python bridge. A real parse happens locally with
#   omarchy plugin validate .

on:
  push:
    branches: [master]
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs (not mutable tags) so
      # the workflow can't be silently swapped under us. Full history is
      # fetched because secrets scans must see every commit ever pushed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Reject agent-control files (recursive release guard)
        shell: bash
        run: |
          set -euo pipefail
          # Marketplace ships the whole repository tree, so submitter-controlled
          # agent instructions would persist inside the plugin scope. Guard
          # against every known agent-control filename at any depth.
          found=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            found="$found${found:+$'\n'}$f"
          done < <(find . -path ./.git -prune -o -type f \( \
            -iname 'AGENTS.md' \
            -o -iname 'AGENT.md' \
            -o -iname 'CLAUDE.md' \
            -o -iname 'CURSOR.md' \
            -o -iname 'CVS.md' \
            -o -iname 'CODEOWNERS.md' \
            -o -iname '.cursorrules' \
            -o -iname 'COPILOT_INSTRUCTIONS.md' \
            -o -iname 'CONTEXT.md' \
            -o -iname 'RULES.md' \
            -o -iname '*.mdc' \
          \) -print)
          if [ -n "$found" ]; then
            echo "::error::Agent-control files must not ship in the plugin:"
            printf '  %s\n' "$found"
            exit 1
          fi
          echo "No agent-control files found."
      - name: Run JS model tests
        shell: bash
        run: |
          set -euxo pipefail
          for t in test_config test_connection test_model test_row_model test_credentials test_mark; do
            node "tests/$t.js"
          done
      - name: Byte-compile the bridge
        shell: bash
        run: python3 -m py_compile bin/oh-bridge tests/fake_openhab.py tests/test_bridge.py
      - name: Run bridge tests
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 python3 tests/test_bridge.py

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}